name: Build Score Counter for macOS

on:
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS DMG
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 PyInstaller

      - name: Check project
        run: |
          echo "Project files:"
          ls -la
          python --version
          python -c "import PySide6; print(PySide6.__version__)"

      - name: Build application
        run: |
          pyinstaller \
            --windowed \
            --name "Score Counter" \
            --noconfirm \
            --clean \
            score_counter.py

      - name: Create DMG
        run: |
          mkdir -p dmg
          cp -R "dist/Score Counter.app" "dmg/"
          ln -s /Applications "dmg/Applications"
          hdiutil create \
            -volname "Score Counter" \
            -srcfolder "dmg" \
            -ov \
            -format UDZO \
            "Score-Counter-macOS.dmg"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Score-Counter-macOS
          path: Score-Counter-macOS.dmg
          if-no-files-found: error
