name: Build Score Counter for macOS

on:
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS DMG
    runs-on: macos-14

    steps:

      # ==========================================
      # Получаем исходники
      # ==========================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # Python
      # ==========================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ==========================================
      # Установка библиотек
      # ==========================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 PyInstaller


      # ==========================================
      # Проверка файлов
      # ==========================================

      - name: Check project
        run: |
          echo "Project files:"
          ls -la

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "PySide6:"
          python -c "import PySide6; print(PySide6.__version__)"


      # ==========================================
      # Сборка APP
      # ==========================================

      - name: Build application
        run: |
          pyinstaller \
            --windowed \
            --name "Score Counter" \
            --noconfirm \
            --clean \
            score_counter.py


      # ==========================================
      # Проверяем APP
      # ==========================================

      - name: Check APP
        run: |
          echo "Built application:"
          ls -lah "dist/"

          echo ""
          echo "APP contents:"
          find "dist/Score Counter.app" -maxdepth 2 -type f | head -30


      # ==========================================
      # Создание DMG
      # ==========================================

      - name: Create DMG
        run: |

          mkdir -p dmg

          cp -R "dist/Score Counter.app" "dmg/"

          ln -s /Applications "dmg/Applications"

          hdiutil create \
            -volname "Score Counter" \
            -srcfolder "dmg" \
            -ov \
            -format UDZO \
            "Score-Counter-macOS.dmg"


      # ==========================================
      # Проверяем DMG
      # ==========================================

      - name: Check DMG
        run: |
          ls -lh "Score-Counter-macOS.dmg"

          hdiutil imageinfo "Score-Counter-macOS.dmg" | head -30


      # ==========================================
      # Загружаем DMG как Artifact
      # ==========================================

          if-no-files-found: error        with:
          name: Score-Counter-macOS
          path: Score-Counter-macOS.dmg
