name: Build Score Counter for macOS

on:
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS Universal 2 DMG
    runs-on: macos-14

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout
        uses: actions/checkout@v6


      # ==========================================
      # INSTALL UNIVERSAL2 PYTHON
      # ==========================================

      - name: Setup Universal2 Python
        shell: bash
        run: |
          set -e

          echo "=================================="
          echo "INSTALLING UNIVERSAL2 PYTHON"
          echo "=================================="

          PYTHON_VERSION="3.12.10"

          curl -L \
            "https://www.python.org/ftp/python/${PYTHON_VERSION}/python-${PYTHON_VERSION}-macos11.pkg" \
            -o python.pkg

          sudo installer \
            -pkg python.pkg \
            -target /

          echo ""
          echo "Python installations:"
          ls -la /Library/Frameworks/Python.framework/Versions/

          echo ""
          echo "Python architecture:"
          file /Library/Frameworks/Python.framework/Versions/3.12/bin/python3

          echo ""
          echo "Python version:"
          /Library/Frameworks/Python.framework/Versions/3.12/bin/python3 --version


      # ==========================================
      # ADD PYTHON TO PATH
      # ==========================================

      - name: Configure Python
        shell: bash
        run: |
          echo "/Library/Frameworks/Python.framework/Versions/3.12/bin" >> "$GITHUB_PATH"


      # ==========================================
      # INSTALL DEPENDENCIES
      # ==========================================

      - name: Install dependencies
        shell: bash
        run: |
          set -e

          python3 -m pip install --upgrade pip

          python3 -m pip install \
            --upgrade \
            PySide6 \
            PyInstaller


      # ==========================================
      # CHECK ENVIRONMENT
      # ==========================================

      - name: Check environment
        shell: bash
        run: |
          set -e

          echo "=================================="
          echo "ENVIRONMENT CHECK"
          echo "=================================="

          echo ""
          echo "Python:"
          python3 --version

          echo ""
          echo "Python executable:"
          which python3

          echo ""
          echo "Python architecture:"
          file "$(which python3)"

          echo ""
          echo "PySide6 version:"
          python3 -c "import PySide6; print(PySide6.__version__)"

          echo ""
          echo "PyInstaller version:"
          pyinstaller --version

          echo ""
          echo "Project files:"
          ls -la


      # ==========================================
      # BUILD UNIVERSAL 2 APPLICATION
      # ==========================================

      - name: Build Universal 2 application
        shell: bash
        run: |
          set -e

          echo "=================================="
          echo "BUILDING UNIVERSAL 2 APPLICATION"
          echo "=================================="

          rm -rf build
          rm -rf dist

          pyinstaller \
            --windowed \
            --name "Score Counter" \
            --noconfirm \
            --clean \
            --target-arch universal2 \
            score_counter.py

          echo ""
          echo "BUILD FINISHED"


      # ==========================================
      # CHECK APP
      # ==========================================

      - name: Check application
        shell: bash
        run: |
          set -e

          echo "=================================="
          echo "CHECKING APPLICATION"
          echo "=================================="

          APP="dist/Score Counter.app"

          if [ ! -d "$APP" ]; then
            echo ""
            echo "ERROR: Score Counter.app was not created!"
            exit 1
          fi

          echo ""
          echo "Application created successfully:"
          ls -lah "dist/"

          echo ""
          echo "Application structure:"
          ls -lah "$APP/Contents/"

          echo ""
          echo "Executable:"
          ls -lah "$APP/Contents/MacOS/"


      # ==========================================
      # VERIFY UNIVERSAL 2
      # ==========================================

      - name: Verify Universal 2 architecture
        shell: bash
        run: |
          set -e

          echo "=================================="
          echo "VERIFYING UNIVERSAL 2"
          echo "=================================="

          APP="dist/Score Counter.app"
          EXEC="$APP/Contents/MacOS/Score Counter"

          if [ ! -f "$EXEC" ]; then
            echo ""
            echo "ERROR: Application executable not found!"
            exit 1
          fi

          echo ""
          echo "Executable:"
          echo "$EXEC"

          echo ""
          echo "Architectures:"
          lipo -archs "$EXEC"

          echo ""
          echo "Detailed architecture information:"
          lipo -info "$EXEC"

          echo ""
          echo "Checking x86_64 slice..."

          if lipo -verify_arch x86_64 "$EXEC"; then
            echo "OK: x86_64 architecture found."
          else
            echo "ERROR: x86_64 architecture NOT found!"
            exit 1
          fi

          echo ""
          echo "Checking arm64 slice..."

          if lipo -verify_arch arm64 "$EXEC"; then
            echo "OK: arm64 architecture found."
          else
            echo "ERROR: arm64 architecture NOT found!"
            exit 1
          fi

          echo ""
          echo "=================================="
          echo "UNIVERSAL 2 VERIFICATION SUCCESS"
          echo "=================================="

          echo ""
          echo "Intel Macs:"
          echo "  x86_64"

          echo ""
          echo "Apple Silicon Macs:"
          echo "  arm64"

          echo ""
          echo "Result:"
          echo "  Universal 2 = YES"


      # ==========================================
      # CREATE DMG
      # ==========================================

      - name: Create DMG
        shell: bash
        run: |
          set -e

          echo "=================================="
          echo "CREATING DMG"
          echo "=================================="

          rm -rf dmg
          rm -f "Score-Counter.dmg"

          mkdir -p dmg

          echo ""
          echo "Copying application..."

          cp -R \
            "dist/Score Counter.app" \
            "dmg/"

          echo ""
          echo "Creating Applications shortcut..."

          ln -s \
            /Applications \
            "dmg/Applications"

          echo ""
          echo "Creating DMG..."

          hdiutil create \
            -volname "Score Counter" \
            -srcfolder "dmg" \
            -ov \
            -format UDZO \
            "Score-Counter.dmg"

          echo ""
          echo "DMG created successfully."


      # ==========================================
      # CHECK DMG
      # ==========================================

      - name: Check DMG
        shell: bash
        run: |
          set -e

          echo "=================================="
          echo "CHECKING DMG"
          echo "=================================="

          if [ ! -f "Score-Counter.dmg" ]; then
            echo ""
            echo "ERROR: Score-Counter.dmg was not created!"
            exit 1
          fi

          echo ""
          echo "DMG file:"
          ls -lh "Score-Counter.dmg"

          echo ""
          echo "DMG information:"
          hdiutil imageinfo "Score-Counter.dmg" | head -40

          echo ""
          echo "=================================="
          echo "DMG SUCCESSFULLY CREATED"
          echo "=================================="


      # ==========================================
      # UPLOAD DMG
      # ==========================================

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: Score-Counter-macOS-Universal2
          path: Score-Counter.dmg
          if-no-files-found: error
